[project]
name = "task-manager"
version = "0.1.0"
description = "Task Manager API built with FastAPI, PostgreSQL, and JWT Authentication"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "fastapi==0.110.1",
    "uvicorn[standard]==0.29.0",
    "sqlalchemy==2.0.30",
    "sqlmodel==0.0.21",
    "alembic==1.13.1",
    "asyncpg==0.29.0",
    "psycopg2-binary==2.9.9",
    "pydantic==2.7.2",
    "pydantic-settings==2.3.3",
    "python-jose[cryptography]==3.3.0",
    "passlib==1.7.4",
    "bcrypt==4.0.1",
    "python-multipart==0.0.9",
    "email-validator==2.1.0.post1",
    "httpx==0.27.0",
    "aiosqlite==0.20.0",
    "pytest==8.2.1",
    "pytest-asyncio==0.24.0",
    "pytest-cov==5.0.0",
    "faker==25.1.0",
    "ruff==0.4.4",
    "mypy==1.10.0",
]

[project.optional-dependencies]
dev = [
    "pre-commit==3.7.1",
    "debugpy==1.8.2",
]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "W", "B", "SIM"]
ignore = ["B008"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
skip-magic-trailing-comma = false
line-ending = "auto"

[tool.mypy]
python_version = "3.11"
warn_return_any = false
warn_unused_configs = true
ignore_missing_imports = true
disable_error_code = ["arg-type", "call-overload", "operator", "return-value", "union-attr", "index", "misc", "assignment", "attr-defined"]
exclude = [".venv", "venv", "env", ".git", "__pycache__", "build", "dist", ".mypy_cache", ".ruff_cache", "alembic/versions"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
addopts = "-v --cov=app --cov-report=term-missing"

[tool.coverage.run]
source = ["app"]
omit = ["tests/*", "alembic/*"]

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "def __repr__",
    "raise AssertionError",
    "raise NotImplementedError",
    "if __name__ == .__main__.:",
]

[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["app", "app.models", "app.schemas", "app.core", "app.api", "app.api.routes", "app.services"]