services:
  - type: web
    name: task-manager-api
    runtime: docker
    dockerfilePath: ./Dockerfile
    dockerContext: .
    plan: free
    region: oregon
    healthCheckPath: /health
    autoDeploy: true
    envVars:
      - key: APP_NAME
        value: Task Manager API
      - key: APP_ENV
        value: production
      - key: DEBUG
        value: "false"
      - key: SECRET_KEY
        generateValue: true
      - key: ALGORITHM
        value: HS256
      - key: ACCESS_TOKEN_EXPIRE_MINUTES
        value: "30"
      - key: REFRESH_TOKEN_EXPIRE_DAYS
        value: "7"
      # DATABASE_URL is injected automatically by Render from the database below
      - key: BACKEND_CORS_ORIGINS
        value: '["https://task-manager-api.onrender.com"]'

databases:
  - name: task-manager-db
    databaseName: task_manager
    user: task_manager
    plan: free
    region: oregon